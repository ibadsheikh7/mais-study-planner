<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}MAIS Study Planner{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  {% if session.get('user_id') %}
  <nav class="navbar">
    <div class="nav-inner">
      <div class="logo">📚 MAIS Study Planner</div>
      <ul class="nav-links">
        <li><a href="{{ url_for('dashboard') }}">Dashboard</a></li>
        <li><a href="{{ url_for('chat') }}">AI Chat</a></li>
        <li><a href="{{ url_for('pdf_assistant') }}">PDF Helper</a></li>
        <li><a href="{{ url_for('planner') }}">Planner</a></li>
        <li><a href="{{ url_for('quiz') }}">Quiz</a></li>
        <li><a href="{{ url_for('reports') }}">Reports</a></li>
        <li><a href="{{ url_for('cgpa') }}">CGPA Calculator</a></li>
      </ul>
      <div class="nav-right">
        <button id="themeBtn" class="theme-btn" title="Switch theme">🌙</button>
        <a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>
      </div>
    </div>
  </nav>
  {% endif %}

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <p>Built by a 2nd Semester CIS Student | MAIS STUDY PLANNER</p>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
