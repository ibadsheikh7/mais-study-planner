<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Register - MAIS Study Planner</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
  <div class="auth-card">
    <h1 class="auth-title">✨ Create Account</h1>
    <p class="auth-sub">Start your smart study journey</p>

    {% if error %}<p class="error-msg">{{ error }}</p>{% endif %}

    <form method="POST">
      <label>Full Name</label>
      <input type="text" name="name" required>

      <label>Email</label>
      <input type="email" name="email" required>

      <label>Password</label>
      <input type="password" name="password" required>

      <label>Semester</label>
      <input type="text" name="semester" placeholder="e.g. 2nd Semester" required>

      <button type="submit" class="primary-btn">Register</button>
    </form>

    <p class="auth-foot">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
    <button id="themeBtn" class="theme-btn floating">🌙</button>
  </div>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
